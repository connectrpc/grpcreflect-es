version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "monday"
      timezone: UTC
      time: "07:00"
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "monday"
      timezone: UTC
      time: "07:00"
    open-pull-requests-limit: 50
    groups:
      protobuf-es:
        patterns:
          - "@bufbuild/protobuf"
          - "@bufbuild/protoc-gen-es"
      connect:
        patterns:
          - "@connectrpc/*"
      build:
        patterns:
          - "typescript"
          - "tsx"
          - "@types/node"
          - "turbo"
      lint-and-format:
        patterns:
          - "@biomejs/biome"
          - "@bufbuild/license-header"
          - "@arethetypeswrong/cli"
          - "publint"
