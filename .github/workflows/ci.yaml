name: ci

on:
  push:
    branches: [main, "v*"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # https://consoledonottrack.com/
  DO_NOT_TRACK: 1

jobs:
  tasks:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        task:
          - format
          - license-header
          - lint
          - attw
          - build
          - generate
        include:
          - task: format
            diff-check: true
          - task: license-header
            diff-check: true
          - task: generate
            diff-check: true
    name: ${{ matrix.task }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: "npm"
      - uses: actions/cache@v6
        with:
          path: .turbo
          key: ${{ runner.os }}/${{ matrix.task }}/${{ github.sha }}
          restore-keys: ${{ runner.os }}/${{ matrix.task }}
      - run: npm ci
      - run: npx turbo run ${{ matrix.task }}
      - name: Check changed files
        if: ${{ matrix.diff-check }}
        run: node scripts/gh-diffcheck.js
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x, 26.x]
    name: "test on Node.js ${{ matrix.node-version }}"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
      - uses: actions/cache@v6
        with:
          path: .turbo
          key: ${{ runner.os }}/test/${{ matrix.node-version }}/${{ github.sha }}
          restore-keys: ${{ runner.os }}/test/${{ matrix.node-version }}
      - run: npm ci
      - run: npx turbo run test --log-order stream -F '!./packages/typescript-compat/*'
  test-minimum-versions:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    name: "test with minimum peer versions"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: "npm"
      # Keep in sync with peerDependencies in packages/grpcreflect/package.json
      - run: npm pkg set --workspace packages/grpcreflect devDependencies.@bufbuild/protobuf=2.5.0 devDependencies.@connectrpc/connect=2.0.0
      - run: npm install
      - run: npm test --workspace packages/grpcreflect
  test-bun:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    name: "test on Bun"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: "npm"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: npm ci
      - run: npx turbo run build -F @connectrpc/grpcreflect
      - run: npm run test:bun --workspace packages/grpcreflect
      - run: npm run test:bun --workspace packages/runtime-tests
  test-workers:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    name: "test on Cloudflare Workers"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: "npm"
      - run: npm ci
      - run: npx turbo run test:workers --log-order stream
  test-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    name: "test on ${{ matrix.browser }}"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: "npm"
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
        working-directory: packages/runtime-tests
      - run: npx turbo run test:browser --log-order stream
        env:
          BROWSERS: ${{ matrix.browser }}
  typescript-compat:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    name: "typescript-compat"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: "npm"
      - uses: actions/cache@v6
        with:
          path: .turbo
          key: ${{ runner.os }}/typescript-compat/${{ github.sha }}
          restore-keys: ${{ runner.os }}/typescript-compat
      - run: npm ci
      - run: npx turbo run test --log-order stream -F './packages/typescript-compat/*'
